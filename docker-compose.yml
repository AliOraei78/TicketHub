services:
  # =========================================================================
  # 1. PostgreSQL 17 Database
  # =========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: tickethub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-Password123!}"
      POSTGRES_DB: TicketHubDb
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TicketHubDb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # =========================================================================
  # 2. Redis Distributed Cache & SignalR Backplane
  # =========================================================================
  redis:
    image: redis:alpine
    container_name: tickethub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================================================
  # 3. MinIO Object Storage (S3-Compatible)
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: tickethub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_BIND_IP:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 4. TicketHub Web Application (.NET 10 Blazor Server)
  # =========================================================================
  tickethub-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickethub-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=TicketHubDb;Username=postgres;Password=${DB_PASSWORD:-Password123!};
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - InitialAdmin__Email=${INITIAL_ADMIN_EMAIL:-}
      - InitialAdmin__Password=${INITIAL_ADMIN_PASSWORD:-}
      - InitialAdmin__Name=${INITIAL_ADMIN_NAME:-مدیر کل سیستم}
      - InitialAdmin__PhoneNumber=${INITIAL_ADMIN_PHONE:-}
      - EmailSettings__Host=${SMTP_HOST:-smtp.gmail.com}
      - EmailSettings__Port=${SMTP_PORT:-587}
      - EmailSettings__UserName=${SMTP_USERNAME:-}
      - EmailSettings__Password=${SMTP_PASSWORD:-}
      - EmailSettings__FromEmail=${SMTP_FROM_EMAIL:-}
      - EmailSettings__FromName=${SMTP_FROM_NAME:-TicketHub System}
      - Storage__Provider=${STORAGE_PROVIDER:-Local}
      - Storage__LocalPath=${STORAGE_LOCAL_PATH:-uploads}
      - Storage__Endpoint=${STORAGE_ENDPOINT:-http://minio:9000}
      - Storage__BucketName=${STORAGE_BUCKET:-tickethub-attachments}
      - Storage__AccessKey=${STORAGE_ACCESS_KEY:-minioadmin}
      - Storage__SecretKey=${STORAGE_SECRET_KEY:-minioadmin}
      - Storage__Region=${STORAGE_REGION:-us-east-1}
      - Storage__ForcePathStyle=${STORAGE_FORCE_PATH_STYLE:-true}
      - Storage__UseSsl=${STORAGE_USE_SSL:-false}
      - SSO__Enabled=${SSO_ENABLED:-false}
      - SSO__ProviderName=${SSO_PROVIDER_NAME:-OIDC}
      - SSO__DisplayName=${SSO_DISPLAY_NAME:-ورود یکپارچه سازمانی (SSO)}
      - SSO__Authority=${SSO_AUTHORITY:-}
      - SSO__ClientId=${SSO_CLIENT_ID:-}
      - SSO__ClientSecret=${SSO_CLIENT_SECRET:-}
      - SSO__RequireHttpsMetadata=${SSO_REQUIRE_HTTPS:-false}
      - SSO__AutoProvisionUsers=${SSO_AUTO_PROVISION:-true}
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/wwwroot/uploads
      - app_keys:/app/dataprotection-keys

volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_logs:
  app_uploads:
  app_keys:
