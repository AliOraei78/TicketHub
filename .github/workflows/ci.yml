name: TicketHub CI/CD & Automated Testing

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright E2E Tests'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # =========================================================================
  # 1. Build & Unit/bUnit Automated Testing (Runs on every Commit & Push)
  # =========================================================================
  build-and-unit-tests:
    name: Build & bUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run bUnit & Unit Tests
        run: >
          dotnet test TicketHub.Tests.bUnit/TicketHub.Tests.bUnit.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit_test_results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunit-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

      - name: Upload Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7

  # =========================================================================
  # 2. Playwright End-to-End (E2E) Testing (Runs on Pre-Release Tags, PRs & Manual)
  # =========================================================================
  e2e-playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e == true)

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Password123!'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1' -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build E2E Test Project
        run: dotnet build TicketHub.Tests.E2E/TicketHub.Tests.E2E.csproj --configuration Release

      - name: Install Playwright Browsers & Dependencies
        run: pwsh TicketHub.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          E2E_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=TicketHubDb_E2E;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true;"
        run: >
          dotnet test TicketHub.Tests.E2E/TicketHub.Tests.E2E.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=e2e_test_results.trx"

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  # =========================================================================
  # 3. Build & Publish Docker Image to GitHub Packages (ghcr.io)
  # =========================================================================
  build-and-push-docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, e2e-playwright-tests]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-and-unit-tests.result == 'success' &&
      (needs.e2e-playwright-tests.result == 'success' || needs.e2e-playwright-tests.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
