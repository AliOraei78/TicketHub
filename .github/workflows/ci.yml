name: TicketHub CI/CD & Automated Testing

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright E2E Tests'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # =========================================================================
  # 1. Build & Unit/bUnit Automated Testing (Runs on every Commit & Push)
  # =========================================================================
  build-and-unit-tests:
    name: Build & bUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run bUnit & Unit Tests
        run: >
          dotnet test TicketHub.Tests.bUnit/TicketHub.Tests.bUnit.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit_test_results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunit-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

      - name: Upload Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7

  # =========================================================================
  # 2. Playwright End-to-End (E2E) Testing (Runs on Pre-Release Tags, PRs & Manual)
  # =========================================================================
  e2e-playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e == true)

    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 'Password123!'
          POSTGRES_DB: TicketHubDb_E2E
        options: >-
          --health-cmd "pg_isready -U postgres -d TicketHubDb_E2E"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build E2E Test Project
        run: dotnet build TicketHub.Tests.E2E/TicketHub.Tests.E2E.csproj --configuration Release

      - name: Install Playwright Browsers & Dependencies
        run: pwsh TicketHub.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          E2E_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=TicketHubDb_E2E;Username=postgres;Password=Password123!;"
        run: >
          dotnet test TicketHub.Tests.E2E/TicketHub.Tests.E2E.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=e2e_test_results.trx"

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  # =========================================================================
  # 3. Build & Publish Docker Image to Docker Hub & GitHub Packages
  # =========================================================================
  build-and-push-docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, e2e-playwright-tests]
    if: |
      needs.build-and-unit-tests.result == 'success' &&
      (
        (startsWith(github.ref, 'refs/tags/v') && (needs.e2e-playwright-tests.result == 'success' || needs.e2e-playwright-tests.result == 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && (needs.e2e-playwright-tests.result == 'success' || needs.e2e-playwright-tests.result == 'skipped'))
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/tickethub-web', secrets.DOCKERHUB_USERNAME) || '' }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. Continuous Deployment to Ubuntu VPS via SSH (Runs ONLY on Release Tags)
  # =========================================================================
  deploy-to-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    if: |
      needs.build-and-push-docker-image.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/xnario/tickethub
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f


